services:
  app:
    build: .
    container_name: webhook_app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8007"
    networks:
      - webhook_net

  nginx:
    image: nginx:1.27-alpine
    container_name: webhook_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      # позже добавишь 443:443, когда подключишь TLS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - webhook_net

networks:
  webhook_net:
    driver: bridge